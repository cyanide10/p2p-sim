# Four-node variant used by docker-compose.node4.yml (scaling test).
# Every node, not just a coordinator, must be given this same list.
peers:
  - id: node-1
    url: http://node-1:8000
  - id: node-2
    url: http://node-2:8000
  - id: node-3
    url: http://node-3:8000
  - id: node-4
    url: http://node-4:8000
