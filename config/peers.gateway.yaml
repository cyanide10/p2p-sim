# Peer list for the gateway, which runs on the host. Ids must match the
# nodes' NODE_IDs; URLs are the host ports docker-compose.yml publishes.
# The nodes themselves keep using peers.yaml with Compose DNS names.
peers:
  - id: node-1
    url: http://127.0.0.1:8081
  - id: node-2
    url: http://127.0.0.1:8082
  - id: node-3
    url: http://127.0.0.1:8083
