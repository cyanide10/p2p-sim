# Runs with a read-only root filesystem: every writable path is under /tmp (tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. Resolving the gateway per request lets nginx start
  # (and serve the mock build) even when no gateway container exists.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }

    # Same-origin gateway API (docs/gateway-api.md). Only used by builds with VITE_USE_MOCK=false.
    location ~ ^/(api/|healthz$) {
      set $gateway http://gateway:8080;
      proxy_pass $gateway;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }
  }
}
